<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Quotations — Lab</title>
  <link rel="stylesheet" href="/css/lab-chat.css">
</head>
<body>
  <main class="stage" id="stage">
    <section class="phone" aria-label="Quotation threads">
      <header class="topbar">
        <div class="title-group">
          <span class="agent-avatar" aria-hidden="true">Q<i></i></span>
          <div>
            <small id="subtitle">Your quotations</small>
            <h1>Quotations</h1>
          </div>
        </div>
        <div class="header-buttons">
          <span class="lab-badge">LAB</span>
          <button class="icon-button" id="theme-btn" type="button" aria-label="Toggle theme">&#9790;</button>
        </div>
      </header>

      <div class="thread-list" id="list" aria-busy="true">
        <p class="list-status">Loading…</p>
      </div>

      <div class="list-footer">
        <button class="new-thread" id="new-btn" type="button">
          <span aria-hidden="true">+</span> New Quotation
        </button>
      </div>
    </section>
  </main>

  <script src="/js/lab-threads.js"></script>
</body>
</html>
