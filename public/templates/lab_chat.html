<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Quotation Chat — Lab</title>
  <link rel="stylesheet" href="/css/lab-chat.css">
</head>
<body>
  <main class="stage" id="stage">
    <section class="phone" aria-label="Conversational quotation prototype">
      <header class="topbar">
        <div class="title-group">
          <span class="agent-avatar" aria-hidden="true">Q<i></i></span>
          <div>
            <small id="agent-status">Online</small>
            <h1>Quotation</h1>
          </div>
        </div>
        <div class="header-buttons">
          <span class="lab-badge">LAB</span>
          <button class="icon-button" id="reset-btn" type="button" aria-label="Start over">&#8635;</button>
          <button class="icon-button" id="theme-btn" type="button" aria-label="Toggle theme">&#9790;</button>
        </div>
      </header>

      <div class="chat-content" id="feed">
        <div class="day-pill">Today</div>
      </div>

      <form class="composer-wrap" id="composer" autocomplete="off">
        <input id="input" placeholder="Enter the customer's monthly bill…" aria-label="Message">
        <button class="send" id="send" type="submit" aria-label="Send">&#10148;</button>
      </form>
    </section>
  </main>

  <script src="/js/lab-chat.js"></script>
</body>
</html>
