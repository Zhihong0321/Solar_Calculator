<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>My Google Review Claims | ETERNALGY OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/google-review.css">
</head>
<body>
    <header class="gr-header">
        <div class="gr-header-inner">
            <a href="/google-review" class="gr-back" title="Back to Google Review Programme"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <h1 class="gr-title">My Review Claims</h1>
                <p class="gr-subtitle">Google Review Programme</p>
            </div>
        </div>
    </header>

    <main class="gr-main">
        <div class="gr-pagelinks">
            <a href="/google-review" class="gr-link-btn"><i class="fa-solid fa-plus"></i> New Claim</a>
        </div>
        <div class="gr-stats">
            <div class="gr-stat"><div class="gr-stat-label">Submitted</div><div class="gr-stat-value" id="statTotal">–</div></div>
            <div class="gr-stat"><div class="gr-stat-label">Pending</div><div class="gr-stat-value" id="statPending">–</div></div>
            <div class="gr-stat"><div class="gr-stat-label">Bonus to be paid</div><div class="gr-stat-value" id="statApproved">–</div></div>
            <div class="gr-stat"><div class="gr-stat-label">Bonus paid</div><div class="gr-stat-value" id="statPaid">–</div></div>
        </div>

        <div class="gr-tabs" id="tabs">
            <button type="button" class="gr-tab active" data-status="">All</button>
            <button type="button" class="gr-tab" data-status="Pending">Pending</button>
            <button type="button" class="gr-tab" data-status="Approved">Approved</button>
            <button type="button" class="gr-tab" data-status="Paid">Paid</button>
            <button type="button" class="gr-tab" data-status="Rejected">Rejected</button>
        </div>

        <div id="list" class="gr-list" style="max-height:none;margin-top:0"><div class="gr-empty">Loading…</div></div>
    </main>

    <div class="gr-lightbox" id="lightbox"><img id="lightboxImg" alt="Review photo"></div>

    <script>
    (() => {
        const $ = (id) => document.getElementById(id);
        const escapeHtml = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmtDate = (v) => v ? new Date(v).toLocaleString('en-MY', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
        const fmtMobile = (d) => !d ? '' : d.length === 11 ? `${d.slice(0, 3)}-${d.slice(3, 7)} ${d.slice(7)}` : `${d.slice(0, 3)}-${d.slice(3, 6)} ${d.slice(6)}`;
        const rm = (n) => `RM${Number(n || 0).toLocaleString('en-MY', { maximumFractionDigits: 2 })}`;
        let claims = [];
        let filter = '';

        function render() {
            const rows = filter ? claims.filter((c) => c.status === filter) : claims;
            $('statTotal').textContent = claims.length;
            $('statPending').textContent = claims.filter((c) => c.status === 'Pending').length;
            $('statApproved').textContent = rm(claims.filter((c) => c.status === 'Approved').reduce((s, c) => s + Number(c.agent_bonus), 0));
            $('statPaid').textContent = rm(claims.filter((c) => c.status === 'Paid').reduce((s, c) => s + Number(c.agent_bonus), 0));

            if (!rows.length) {
                $('list').innerHTML = `<div class="gr-card gr-empty">${claims.length ? 'No claims with this status.' : 'No claims yet. <a href="/google-review" style="color:#93c5fd">Submit your first one</a>.'}</div>`;
                return;
            }
            $('list').innerHTML = rows.map((c) => `
                <div class="gr-card gr-claim">
                    ${c.photo_url ? `<img class="gr-thumb" src="${escapeHtml(c.photo_url)}" alt="Review photo" loading="lazy" data-full="${escapeHtml(c.photo_url)}">` : ''}
                    <div class="gr-claim-body">
                        <div class="gr-claim-top">
                            <div class="gr-claim-name">${escapeHtml(c.customer_name || c.customer_id)}</div>
                            <span class="gr-pill ${escapeHtml(c.status)}">${escapeHtml(c.status)}</span>
                        </div>
                        <div class="gr-claim-meta">
                            Submitted ${escapeHtml(fmtDate(c.created_at))}<br>
                            TNG reload: <b>${escapeHtml(fmtMobile(c.tng_mobile))}</b> · ${rm(c.customer_bonus)}<br>
                            Your bonus: <b>${rm(c.agent_bonus)}</b>
                            ${c.paid_at ? `<br>Paid ${escapeHtml(fmtDate(c.paid_at))}` : ''}
                        </div>
                        ${c.remark ? `<div class="gr-remark"><i class="fa-solid fa-comment"></i> ${escapeHtml(c.remark)}</div>` : ''}
                    </div>
                </div>`).join('');
        }

        $('tabs').addEventListener('click', (e) => {
            const btn = e.target.closest('.gr-tab');
            if (!btn) return;
            filter = btn.dataset.status;
            document.querySelectorAll('.gr-tab').forEach((t) => t.classList.toggle('active', t === btn));
            render();
        });
        $('list').addEventListener('click', (e) => {
            const img = e.target.closest('.gr-thumb');
            if (!img) return;
            $('lightboxImg').src = img.dataset.full;
            $('lightbox').classList.add('show');
        });
        $('lightbox').addEventListener('click', () => $('lightbox').classList.remove('show'));

        fetch('/api/google-review/claims/mine', { credentials: 'same-origin' })
            .then(async (res) => {
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || 'Failed to load claims');
                claims = data.claims || [];
                render();
            })
            .catch((err) => { $('list').innerHTML = `<div class="gr-card gr-empty">${escapeHtml(err.message)}</div>`; });
    })();
    </script>
    <script src="/js/navigation.js"></script>
</body>
</html>
