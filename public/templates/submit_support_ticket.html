<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Submit Support Ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#047857">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Eternalgy Agent OS">
    <link rel="apple-touch-icon" href="/logo.png">

    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background-color: #f0f2f5;
            height: 100vh;
            height: 100dvh;
            overscroll-behavior: none;
        }
        .customer-option:active { background-color: #f5f6f6; }
        #thumbList img { width: 100%; height: 80px; object-fit: cover; border-radius: 0.5rem; }
        .tab-btn { flex: 1; text-align: center; font-size: 13px; font-weight: 600; padding: 10px 0; color: #6b7280; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #047857; border-bottom-color: #047857; }
        .status-pill { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; text-transform: uppercase; white-space: nowrap; }
        .status-unread { background: #fee2e2; color: #b91c1c; }
        .status-read-by-support { background: #fef3c7; color: #92400e; }
        .status-processing { background: #dbeafe; color: #1d4ed8; }
        .status-solved { background: #dcfce7; color: #15803d; }
        .my-ticket-row:active { background-color: #f5f6f6; }
    </style>
</head>
<body class="flex flex-col overflow-hidden w-full">

    <!-- Header -->
    <header class="bg-emerald-700 text-white px-6 flex items-center gap-3 shrink-0 shadow-md z-10" style="padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: 1rem;">
        <button onclick="window.location.href='/agent/home'" class="p-1 hover:bg-white/10 rounded-full transition-colors" title="Go Back">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </button>
        <h1 class="font-bold text-lg">Support Ticket</h1>
    </header>

    <!-- Tabs -->
    <div class="bg-white flex border-b border-gray-200 shrink-0">
        <button class="tab-btn active" id="tabSubmitBtn" onclick="switchTab('submit')">Submit New</button>
        <button class="tab-btn" id="tabMineBtn" onclick="switchTab('mine')">My Tickets</button>
    </div>

    <!-- Form -->
    <main class="flex-1 overflow-y-auto bg-white" id="submitPane">
        <form id="ticketForm" class="p-4 space-y-5 max-w-lg mx-auto">

            <div>
                <label class="block text-xs text-gray-500 uppercase font-semibold mb-1">Customer</label>
                <input type="text" id="customerSearch" placeholder="Search your customer by name/phone..."
                       class="w-full bg-gray-100 border-none rounded-lg py-2.5 px-4 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" autocomplete="off">
                <div id="customerResults" class="border border-gray-200 rounded-lg mt-1 divide-y divide-gray-100 hidden max-h-48 overflow-y-auto"></div>
                <div id="selectedCustomer" class="hidden mt-2 flex items-center justify-between bg-emerald-50 text-emerald-800 rounded-lg px-3 py-2 text-sm">
                    <span id="selectedCustomerName"></span>
                    <button type="button" onclick="clearCustomer()" class="text-emerald-600 font-bold">&times;</button>
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-500 uppercase font-semibold mb-1">Title <span class="text-red-500">*</span></label>
                <select id="titleSelect" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    <option value="" disabled selected>Select issue type...</option>
                    <option>Water Leaking</option>
                    <option>Electrical Issue</option>
                    <option>Inverter Issue</option>
                    <option>Installation Issue</option>
                    <option>High Electricity Bill Issue</option>
                    <option>Monitoring / WiFi Issue</option>
                    <option>Generation Issue</option>
                    <option>Battery Issue</option>
                    <option>Others</option>
                </select>
                <input type="text" id="titleInput" placeholder="Describe your issue title..."
                       class="hidden w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none mt-2">
            </div>

            <div>
                <label class="block text-xs text-gray-500 uppercase font-semibold mb-1">Problem Description <span class="text-red-500">*</span></label>
                <textarea id="descriptionInput" required rows="5" placeholder="Describe the issue in detail..."
                          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
            </div>

            <div>
                <label class="block text-xs text-gray-500 uppercase font-semibold mb-1">Photos (optional, up to 6)</label>
                <input type="file" id="imageInput" accept="image/*" multiple capture="environment"
                       class="w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-emerald-600 file:text-white file:text-sm">
                <div id="thumbList" class="grid grid-cols-3 gap-2 mt-2"></div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-700 text-white font-semibold py-3 rounded-lg">
                Submit Ticket
            </button>

            <div id="successMsg" class="hidden bg-emerald-50 text-emerald-800 rounded-lg px-4 py-3 text-sm text-center">
                Ticket submitted successfully. Our support team will follow up.
            </div>
            <div id="errorMsg" class="hidden bg-red-50 text-red-700 rounded-lg px-4 py-3 text-sm text-center"></div>
        </form>
    </main>

    <!-- My Tickets Pane -->
    <main class="flex-1 overflow-y-auto bg-white hidden" id="minePane">
        <div class="flex flex-col" id="myTicketsList">
            <div class="p-8 text-center text-gray-500">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-current border-t-transparent text-emerald-600 rounded-full mb-4"></div>
                <p>Loading your tickets...</p>
            </div>
        </div>
    </main>

    <!-- Read-only Ticket Detail Modal -->
    <div id="myTicketModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:max-w-lg sm:rounded-xl rounded-t-xl max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
                <h2 class="font-bold text-gray-900" id="myTicketModalTitle">Ticket</h2>
                <button onclick="closeMyTicketModal()" class="p-1 text-gray-400 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 space-y-4" id="myTicketModalBody"></div>
        </div>
    </div>

    <script>
        let selectedCustomerId = null;
        let searchDebounce = null;

        document.getElementById('customerSearch').addEventListener('input', (e) => {
            clearTimeout(searchDebounce);
            const query = e.target.value.trim();
            if (!query) {
                document.getElementById('customerResults').classList.add('hidden');
                return;
            }
            searchDebounce = setTimeout(() => searchCustomers(query), 300);
        });

        async function searchCustomers(query) {
            try {
                const res = await fetch(`/api/customers?search=${encodeURIComponent(query)}&limit=10`);
                if (res.status === 401) {
                    window.location.href = '/agent/home';
                    return;
                }
                const json = await res.json();
                const customers = json?.data?.customers || [];
                renderCustomerResults(customers);
            } catch (err) {
                console.error('Customer Search Error:', err);
            }
        }

        function renderCustomerResults(customers) {
            const container = document.getElementById('customerResults');
            if (!customers.length) {
                container.innerHTML = `<div class="px-3 py-2 text-sm text-gray-400">No customers found</div>`;
                container.classList.remove('hidden');
                return;
            }
            container.innerHTML = customers.map(c => `
                <div class="customer-option px-3 py-2 text-sm cursor-pointer" onclick="selectCustomer('${c.customer_id}', '${escapeAttr(c.name || 'Unnamed')}')">
                    <span class="font-medium">${escapeHtml(c.name || 'Unnamed')}</span>
                    <span class="text-gray-400 text-xs ml-2">${escapeHtml(c.phone || '')}</span>
                </div>
            `).join('');
            container.classList.remove('hidden');
        }

        function selectCustomer(id, name) {
            selectedCustomerId = id;
            document.getElementById('selectedCustomerName').textContent = name;
            document.getElementById('selectedCustomer').classList.remove('hidden');
            document.getElementById('customerResults').classList.add('hidden');
            document.getElementById('customerSearch').value = '';
        }

        function clearCustomer() {
            selectedCustomerId = null;
            document.getElementById('selectedCustomer').classList.add('hidden');
        }

        document.getElementById('imageInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files || []);
            const thumbList = document.getElementById('thumbList');
            thumbList.innerHTML = '';
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    thumbList.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        });

        document.getElementById('titleSelect').addEventListener('change', (e) => {
            const customTitle = document.getElementById('titleInput');
            const isOthers = e.target.value === 'Others';
            customTitle.classList.toggle('hidden', !isOthers);
            customTitle.required = isOthers;
            if (isOthers) customTitle.focus();
            else customTitle.value = '';
        });

        document.getElementById('ticketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');
            successMsg.classList.add('hidden');
            errorMsg.classList.add('hidden');

            const titleChoice = document.getElementById('titleSelect').value;
            const title = titleChoice === 'Others'
                ? document.getElementById('titleInput').value.trim()
                : titleChoice;
            const description = document.getElementById('descriptionInput').value.trim();
            const files = document.getElementById('imageInput').files;

            if (!title || !description) return;

            const formData = new FormData();
            formData.append('title', title);
            formData.append('problem_description', description);
            if (selectedCustomerId) formData.append('customer_id', selectedCustomerId);
            for (const file of files) formData.append('images', file);

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                const res = await fetch('/api/support-tickets', { method: 'POST', body: formData });
                const json = await res.json();
                if (json.success) {
                    successMsg.classList.remove('hidden');
                    document.getElementById('ticketForm').reset();
                    document.getElementById('titleInput').classList.add('hidden');
                    document.getElementById('titleInput').required = false;
                    document.getElementById('thumbList').innerHTML = '';
                    clearCustomer();
                } else {
                    errorMsg.textContent = json.error || 'Failed to submit ticket';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Submit Ticket Error:', err);
                errorMsg.textContent = 'Failed to submit ticket';
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Ticket';
            }
        });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function escapeAttr(str) {
            return String(str == null ? '' : str).replace(/'/g, "\\'");
        }

        function resolveImageUrl(url) {
            if (!url) return '';
            return url.startsWith('//') ? `https:${url}` : url;
        }

        let myTicketsLoaded = false;

        function switchTab(tab) {
            const submitPane = document.getElementById('submitPane');
            const minePane = document.getElementById('minePane');
            const tabSubmitBtn = document.getElementById('tabSubmitBtn');
            const tabMineBtn = document.getElementById('tabMineBtn');

            if (tab === 'mine') {
                submitPane.classList.add('hidden');
                minePane.classList.remove('hidden');
                tabSubmitBtn.classList.remove('active');
                tabMineBtn.classList.add('active');
                loadMyTickets();
            } else {
                submitPane.classList.remove('hidden');
                minePane.classList.add('hidden');
                tabMineBtn.classList.remove('active');
                tabSubmitBtn.classList.add('active');
            }
        }

        async function loadMyTickets() {
            try {
                const res = await fetch('/api/support-tickets/mine');
                if (res.status === 401) {
                    window.location.href = '/agent/home';
                    return;
                }
                const json = await res.json();
                if (json.success) renderMyTickets(json.tickets);
            } catch (err) {
                console.error('Load My Tickets Error:', err);
            }
        }

        function renderMyTickets(tickets) {
            const container = document.getElementById('myTicketsList');
            if (!tickets.length) {
                container.innerHTML = `<div class="p-8 text-center text-gray-500"><p>You haven't submitted any support tickets yet.</p></div>`;
                return;
            }
            container.innerHTML = tickets.map(t => {
                const status = t.status || 'unread';
                const statusClass = 'status-' + status.replace(/\s+/g, '-');
                const date = t.created_date ? new Date(t.created_date).toLocaleDateString('en-MY', { timeZone: 'Asia/Kuala_Lumpur', month: 'short', day: 'numeric', year: 'numeric' }) : '';
                return `
                    <div onclick='openMyTicket(${JSON.stringify(t).replace(/'/g, "&#39;")})' class="my-ticket-row flex flex-col gap-1 px-4 py-3 cursor-pointer border-b border-gray-100 transition-colors">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="font-semibold text-gray-900 text-sm flex-1">${escapeHtml(t.title || 'Untitled')}</h3>
                            <span class="status-pill ${statusClass}">${status}</span>
                        </div>
                        <p class="text-xs text-gray-500 truncate">${escapeHtml(t.customer_name || 'No customer linked')}</p>
                        <span class="text-[11px] text-gray-400">${date}</span>
                    </div>
                `;
            }).join('');
        }

        function openMyTicket(ticket) {
            document.getElementById('myTicketModalTitle').textContent = ticket.title || 'Untitled';
            const images = Array.isArray(ticket.images) ? ticket.images : [];
            const imageHtml = images.length ? `
                <div class="grid grid-cols-3 gap-2">
                    ${images.map(url => { const full = resolveImageUrl(url); return `<a href="${full}" target="_blank"><img src="${full}" class="w-full h-20 object-cover rounded-lg border border-gray-200"></a>`; }).join('')}
                </div>
            ` : '';
            const status = ticket.status || 'unread';
            const statusClass = 'status-' + status.replace(/\s+/g, '-');

            document.getElementById('myTicketModalBody').innerHTML = `
                <div class="flex items-center justify-between">
                    <p class="text-xs text-gray-400 uppercase font-semibold">Status</p>
                    <span class="status-pill ${statusClass}">${status}</span>
                </div>
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold mb-1">Problem Description</p>
                    <p class="text-sm text-gray-800 whitespace-pre-wrap">${escapeHtml(ticket.problem_description || '')}</p>
                </div>
                ${imageHtml}
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold mb-1">Support Team Remark</p>
                    <p class="text-sm text-gray-800 whitespace-pre-wrap">${escapeHtml(ticket.technician_remark || 'No remark yet.')}</p>
                </div>
            `;
            document.getElementById('myTicketModal').classList.remove('hidden');
        }

        function closeMyTicketModal() {
            document.getElementById('myTicketModal').classList.add('hidden');
        }
    </script>
</body>
</html>
