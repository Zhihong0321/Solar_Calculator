<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <title>Company Cloud | ETERNALGY OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/tailwind.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary: #0f172a;
        --brand-blue: #3b82f6;
        --slate-50: #f8fafc;
        --slate-200: #e2e8f0;
        --slate-900: #0f172a;
      }

      * {
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(to bottom, #f8fafc 0%, #f1f5f9 100%);
        color: var(--slate-900);
        min-height: 100vh;
      }

      .cloud-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid var(--slate-200);
      }

      .cloud-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 20px -8px rgba(59, 130, 246, 0.15);
        border-color: var(--brand-blue);
      }
    </style>
  </head>

  <body class="p-6 md:p-12">
    <div class="max-w-3xl mx-auto space-y-8">
      <!-- Header -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <a
            href="/agent/home"
            class="text-slate-500 hover:text-slate-900 font-medium text-sm flex items-center gap-2 mb-4 transition-colors"
          >
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
          </a>
          <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">
            Company Cloud
          </h1>
          <p class="text-slate-500 font-medium mt-1">
            Access shared resources, folders and directories.
          </p>
        </div>
        <div
          class="w-12 h-12 bg-slate-900 rounded-xl flex items-center justify-center text-white hidden md:flex shrink-0 shadow-lg"
        >
          <i class="fa-solid fa-cloud text-xl"></i>
        </div>
      </div>

      <!-- Notice box -->
      <div class="bg-blue-50/60 border border-blue-100 rounded-2xl p-5 flex items-start gap-4 shadow-sm">
        <div class="w-8 h-8 bg-blue-100/50 text-blue-600 rounded-lg flex items-center justify-center shrink-0">
          <i class="fa-solid fa-info text-sm"></i>
        </div>
        <div class="space-y-1">
          <p class="text-xs font-black text-blue-800 uppercase tracking-widest">Notice</p>
          <p class="text-sm font-medium text-blue-600/90 leading-relaxed">
            Please sign up a free pCloud account to upload to company Cloud folder.
          </p>
        </div>
      </div>

      <!-- Cloud links list -->
      <div class="grid gap-4 sm:grid-cols-1">
        <!-- Sales Link Card -->
        <a
          href="https://u.pcloud.link/publink/show?code=kZoShf5ZAQeTPsMPus0YiRkozlWiGfOrbLjk"
          target="_blank"
          rel="noopener noreferrer"
          class="cloud-card bg-white rounded-2xl p-6 shadow-sm flex items-center gap-6"
        >
          <div class="w-14 h-14 bg-sky-50 text-sky-600 rounded-xl flex items-center justify-center shrink-0">
            <i class="fa-solid fa-folder-open text-2xl"></i>
          </div>
          <div class="space-y-1 flex-1">
            <h3 class="text-lg font-bold text-slate-900">
              Sales
            </h3>
            <p class="text-sm font-medium text-slate-500">
              our pCloud shared folder
            </p>
          </div>
          <div class="text-slate-400 font-bold pr-2">
            <i class="fa-solid fa-chevron-right text-lg"></i>
          </div>
        </a>

        <!-- Company Profile PDF Card -->
        <a
          href="https://drive.google.com/file/d/1AAeqJ-b8RzXWZjAf2V1jtzSAQHnDBr8z/view?usp=sharing"
          target="_blank"
          rel="noopener noreferrer"
          class="cloud-card bg-white rounded-2xl p-6 shadow-sm flex items-center gap-6"
        >
          <div class="w-14 h-14 bg-red-50 text-red-600 rounded-xl flex items-center justify-center shrink-0">
            <i class="fa-solid fa-file-pdf text-2xl"></i>
          </div>
          <div class="space-y-1 flex-1">
            <h3 class="text-lg font-bold text-slate-900">
              Company Profile PDF 2025
            </h3>
            <p class="text-sm font-medium text-slate-500">
              Quick download
            </p>
          </div>
          <div class="text-slate-400 font-bold pr-2">
            <i class="fa-solid fa-download text-lg"></i>
          </div>
        </a>
      </div>
    </div>

    <script src="/js/navigation.js"></script>
  </body>
</html>
