<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Submission</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px 10px 40px;
      display: flex;
      justify-content: center;
      background: #0b0d12;
      color: #f2f3f5;
      font-size: 14px;
    }
    .shell { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
    .header { display: flex; flex-direction: column; gap: 4px; padding: 4px 2px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; }
    .badge {
      align-self: flex-start; font-size: 10px; font-weight: 600; letter-spacing: 0.4px;
      text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
      background: rgba(120, 130, 255, 0.18); color: #9aa4ff;
    }
    .back-link { font-size: 12px; color: #9aa4ff; text-decoration: none; }
    h1 { font-size: 19px; margin: 2px 0 4px; }
    .row-tight { display: flex; align-items: center; gap: 8px; }
    .row-tight label { font-size: 12px; opacity: 0.65; flex-shrink: 0; }
    .row-tight input, .row-tight select {
      flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04); color: inherit; font-size: 13px;
    }
    .row-tight select:disabled { opacity: 0.7; }
    .card {
      display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03);
    }
    .upload-card { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); }
    .upload-area {
      display: flex; align-items: center; justify-content: center; min-height: 56px;
      border-radius: 8px; border: 1px dashed rgba(255,255,255,0.25); cursor: pointer;
      text-align: center; padding: 10px; opacity: 0.65; font-size: 13px;
    }
    .card-head { display: flex; align-items: center; gap: 8px; }
    .card-head-text { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
    .file-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .md5 { font-size: 10px; opacity: 0.5; font-family: monospace; }
    .thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .thumb-pdf {
      width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center;
      justify-content: center; font-size: 9px; font-weight: 700; letter-spacing: 0.4px;
      background: rgba(240, 100, 90, 0.18); color: #f2867a;
    }
    .status { margin: 0; font-size: 12px; opacity: 0.75; }
    .status-ok { margin: 0; font-size: 12px; color: #7dd3a8; }
    .status-error { margin: 0; font-size: 12px; color: #f28b82; }
    .status-warn { margin: 0; font-size: 12px; color: #f5c26b; }
    .field-error { font-size: 11px; color: #f28b82; }
    .form-grid { display: flex; flex-direction: column; gap: 8px; }
    .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .field.grow2 { flex: 2; }
    .row { display: flex; gap: 8px; }
    .field-label { font-size: 11px; opacity: 0.65; display: block; }
    .card-section-title { font-size: 13px; font-weight: 700; opacity: 0.85; }
    .checkbox-row { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .checkbox-row label { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: 0.85; }
    .checkbox-row input[type="checkbox"] { width: auto; }
    .field-narrow { flex: 0 0 64px; }
    .buyer-badge {
      font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15); opacity: 0.8; align-self: flex-start;
    }
    input, select, textarea {
      padding: 8px 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04); color: inherit; font-size: 13px; font-family: inherit;
      width: 100%; box-sizing: border-box;
    }
    /* The dropdown list itself is rendered by the OS, on a white/light background, regardless of
       the select's own dark styling above — without this, option text inherits the page's
       near-white color and is illegible against that native popup. */
    select option {
      color: #111827;
      background-color: #ffffff;
    }
    textarea { min-height: 40px; resize: vertical; }
    .btn {
      flex: 1; margin-top: 2px; padding: 10px 14px; border-radius: 9px; border: none;
      background: #6c7bff; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-delete {
      margin-top: 2px; padding: 10px 14px; border-radius: 9px; border: 1px solid rgba(242,139,130,0.4);
      background: transparent; color: #f28b82; font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .btn-delete:disabled { opacity: 0.5; cursor: default; }
    .hidden { display: none; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab {
      flex: 1; padding: 10px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.6); font-weight: 500;
      font-size: 13px; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .tab.active {
      background: rgba(108,123,255,0.15); border-color: rgba(108,123,255,0.4);
      color: #9aa4ff;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .my-claim-card {
      display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03);
      margin-bottom: 10px;
    }
    .my-claim-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .my-claim-vendor { font-size: 14px; font-weight: 600; }
    .my-claim-status {
      font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 600;
    }
    .my-claim-status.pending { background: rgba(108,123,255,0.18); color: #9aa4ff; }
    .my-claim-status.approved { background: rgba(125,211,168,0.18); color: #7dd3a8; }
    .my-claim-status.rejected { background: rgba(242,139,130,0.18); color: #f28b82; }
    .my-claim-amount { font-size: 16px; font-weight: 700; margin: 4px 0; }
    .my-claim-meta { font-size: 11px; opacity: 0.6; }
    .my-claim-actions { display: flex; gap: 6px; margin-top: 6px; }
    .my-claim-actions button {
      flex: 1; padding: 8px; border-radius: 7px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-expand { background: rgba(255,255,255,0.04); color: #9aa4ff; }
    .btn-delete-claim { background: transparent; color: #f28b82; border-color: rgba(242,139,130,0.4); }
    .my-claim-details {
      margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 12px; display: none;
    }
    .my-claim-details.show { display: block; }
    .my-claim-details-row { display: flex; gap: 8px; margin-bottom: 4px; }
    .my-claim-details-label { opacity: 0.6; min-width: 80px; }
    .empty-state {
      text-align: center; padding: 40px 20px; opacity: 0.5; font-size: 13px;
    }
    .my-claim-remark {
      margin-top: 8px; padding: 8px; border-radius: 6px;
      background: rgba(242,139,130,0.08); border: 1px solid rgba(242,139,130,0.2);
      font-size: 12px; color: #f28b82;
    }
    .my-claim-remark-label { font-weight: 600; margin-bottom: 4px; }

    /* Claim-type switcher: swap between the receipt claim and the Business Trip Allowance form. */
    .type-tabs { display: flex; gap: 6px; }
    .type-tab {
      flex: 1; padding: 9px 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.6); font-weight: 500;
      font-size: 12px; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .type-tab.active {
      background: rgba(108,123,255,0.15); border-color: rgba(108,123,255,0.4); color: #9aa4ff;
    }
    .type-panel { display: none; }
    .type-panel.active { display: block; }
    .trip-total { font-weight: 700; color: #9aa4ff; }
    .my-claim-badge {
      font-size: 10px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 999px; background: rgba(245,194,107,0.16); color: #f5c26b;
      margin-bottom: 4px; align-self: flex-start;
    }
    .my-claim-desc { white-space: pre-line; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="header-top">
        <span class="badge">Claim System</span>
        <a class="back-link" href="/agent/home">&larr; Agent Home</a>
      </div>
      <h1>Submit & Track Claims</h1>
      <div class="row-tight">
        <label for="claimant">Submit as</label>
        <select id="claimant"></select>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="submit">Submit New</button>
      <button class="tab" data-tab="my-claims">My Claims</button>
    </div>

    <div id="submit-tab" class="tab-content active">
      <div class="type-tabs">
        <button type="button" class="type-tab active" data-ftype="receipt">Receipt Claim</button>
        <button type="button" class="type-tab" data-ftype="trip">Business Trip Allowance</button>
      </div>

      <div id="receipt-form" class="type-panel active">
        <section class="upload-card">
          <label class="upload-area" for="file-input">+ Add receipt photo(s) or PDF — up to 6 read at once</label>
          <input id="file-input" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,application/pdf" class="hidden" />
          <p class="status hidden" id="upload-status"></p>
        </section>

        <div id="cards"></div>
      </div>

      <div id="trip-form" class="type-panel">
        <section class="card">
          <div class="row">
            <div class="field"><label class="field-label" for="trip-from">Departure date</label><input id="trip-from" type="date" /></div>
            <div class="field"><label class="field-label" for="trip-to">Return date</label><input id="trip-to" type="date" /></div>
          </div>
          <div class="row">
            <div class="field"><label class="field-label" for="trip-departure-point">Departure point</label><input id="trip-departure-point" placeholder="e.g. Johor Bahru" /></div>
            <div class="field"><label class="field-label" for="trip-destination">Destination</label><input id="trip-destination" placeholder="e.g. Penang" /></div>
          </div>
        </section>

        <section class="card">
          <div class="card-section-title">1) Reason for business trip</div>
          <div class="checkbox-row">
            <label><input type="checkbox" id="trip-reason-photograph" /> Photograph</label>
            <label><input type="checkbox" id="trip-reason-sitevisit" /> Site Visit</label>
            <label><input type="checkbox" id="trip-reason-collect" /> Collect Payment</label>
            <label><input type="checkbox" id="trip-reason-other" /> Other</label>
          </div>
          <div class="field hidden" id="trip-reason-other-row"><input id="trip-reason-other-text" placeholder="Specify other reason" /></div>
          <div class="field"><label class="field-label" for="trip-customer-name">Customer name</label><input id="trip-customer-name" /></div>
          <div class="field"><label class="field-label" for="trip-customer-address">Customer address</label><textarea id="trip-customer-address"></textarea></div>
        </section>

        <section class="card">
          <div class="card-section-title">2) Cost</div>

          <label class="field-label">Hostel</label>
          <div class="row">
            <div class="field field-narrow"><input id="trip-hostel1-day" inputmode="numeric" placeholder="Day" /></div>
            <div class="field field-narrow"><input id="trip-hostel1-night" inputmode="numeric" placeholder="Night" /></div>
            <div class="field"><input id="trip-hostel1-cost" inputmode="decimal" placeholder="Cost RM" /></div>
          </div>
          <div class="row">
            <div class="field field-narrow"><input id="trip-hostel2-day" inputmode="numeric" placeholder="Day" /></div>
            <div class="field field-narrow"><input id="trip-hostel2-night" inputmode="numeric" placeholder="Night" /></div>
            <div class="field"><input id="trip-hostel2-cost" inputmode="decimal" placeholder="Cost RM" /></div>
          </div>

          <label class="field-label">Distance (up to 6 legs)</label>
          <div class="row">
            <div class="field"><input id="trip-distance1-from" placeholder="From" /></div>
            <div class="field"><input id="trip-distance1-to" placeholder="To" /></div>
            <div class="field"><input id="trip-distance1-cost" inputmode="decimal" placeholder="Cost RM" /></div>
          </div>
          <div class="row">
            <div class="field"><input id="trip-distance2-from" placeholder="From" /></div>
            <div class="field"><input id="trip-distance2-to" placeholder="To" /></div>
            <div class="field"><input id="trip-distance2-cost" inputmode="decimal" placeholder="Cost RM" /></div>
          </div>
          <div class="row">
            <div class="field"><input id="trip-distance3-from" placeholder="From" /></div>
            <div class="field"><input id="trip-distance3-to" placeholder="To" /></div>
            <div class="field"><input id="trip-distance3-cost" inputmode="decimal" placeholder="Cost RM" /></div>
          </div>
          <div class="row">
            <div class="field"><input id="trip-distance4-from" placeholder="From" /></div>
            <div class="field"><input id="trip-distance4-to" placeholder="To" /></div>
            <div class="field"><input id="trip-distance4-cost" inputmode="decimal" placeholder="Cost RM" /></div>
          </div>
          <div class="row">
            <div class="field"><input id="trip-distance5-from" placeholder="From" /></div>
            <div class="field"><input id="trip-distance5-to" placeholder="To" /></div>
            <div class="field"><input id="trip-distance5-cost" inputmode="decimal" placeholder="Cost RM" /></div>
          </div>
          <div class="row">
            <div class="field"><input id="trip-distance6-from" placeholder="From" /></div>
            <div class="field"><input id="trip-distance6-to" placeholder="To" /></div>
            <div class="field"><input id="trip-distance6-cost" inputmode="decimal" placeholder="Cost RM" /></div>
          </div>

          <label class="field-label" for="trip-toll-cost">Toll</label>
          <input id="trip-toll-cost" inputmode="decimal" placeholder="Cost RM" />

          <label class="field-label">Meals</label>
          <div class="row">
            <div class="field"><label class="field-label" for="trip-meal-day1">Day 1</label><input id="trip-meal-day1" inputmode="decimal" placeholder="RM" /></div>
            <div class="field"><label class="field-label" for="trip-meal-day2">Day 2</label><input id="trip-meal-day2" inputmode="decimal" placeholder="RM" /></div>
            <div class="field"><label class="field-label" for="trip-meal-day3">Day 3</label><input id="trip-meal-day3" inputmode="decimal" placeholder="RM" /></div>
          </div>

          <label class="field-label">Other</label>
          <div class="row">
            <div class="field grow2"><input id="trip-other-remark" placeholder="Remark" /></div>
            <div class="field"><input id="trip-other-cost" inputmode="decimal" placeholder="Cost RM" /></div>
          </div>

          <div class="row-tight">
            <label for="trip-total">Total allowance (RM)</label>
            <input id="trip-total" readonly class="trip-total" placeholder="auto-calculated" />
          </div>
          <div class="row">
            <button type="button" id="trip-submit" class="btn">Submit Business Trip Allowance</button>
          </div>
          <p class="status hidden" id="trip-status"></p>
        </section>
      </div>
    </div>

    <div id="my-claims-tab" class="tab-content">
      <div id="my-claims-list"></div>
    </div>
  </div>

  <script src="/js/claim_submission.js" defer></script>
</body>
</html>
