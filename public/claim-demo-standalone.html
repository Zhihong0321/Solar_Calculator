<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Submission</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px 10px 40px;
      display: flex;
      justify-content: center;
      background: #0b0d12;
      color: #f2f3f5;
      font-size: 14px;
    }
    .shell { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
    .header { display: flex; flex-direction: column; gap: 4px; padding: 4px 2px; }
    .header a { color: #88b4d8; text-decoration: none; font-size: 13px; }
    .header a:hover { text-decoration: underline; }
    .badge { background: #1e3a5f; color: #88b4d8; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; width: fit-content; }
    .title { font-size: 20px; font-weight: 700; margin: 4px 0; }
    .claimant { font-size: 13px; color: #9ca3af; }
    .tabs { display: flex; gap: 4px; padding: 2px; background: #1a1d24; border-radius: 6px; }
    .tab { flex: 1; padding: 8px; text-align: center; font-weight: 600; font-size: 13px; background: transparent; color: #9ca3af; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
    .tab.active { background: #2563eb; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .upload-card { background: #1a1d24; padding: 20px; border-radius: 8px; border: 2px dashed #374151; text-align: center; cursor: pointer; transition: border-color 0.2s; }
    .upload-card:hover { border-color: #2563eb; }
    .upload-area { color: #9ca3af; font-size: 13px; cursor: pointer; }
    .hidden { display: none !important; }
    .card { background: #1a1d24; border-radius: 8px; padding: 16px; margin-top: 12px; }
    .card-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
    .file-name { font-size: 13px; font-weight: 600; }
    .status { font-size: 12px; color: #60a5fa; margin-bottom: 12px; }
    .form-grid { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 12px; }
    .field { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 11px; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select, textarea {
      background: #0b0d12;
      border: 1px solid #374151;
      color: #f2f3f5;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 60px; }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-delete {
      background: #991b1b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .claim-item { background: #1a1d24; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
    .claim-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
    .claim-vendor { font-size: 16px; font-weight: 600; }
    .claim-desc { font-size: 13px; color: #9ca3af; margin-bottom: 12px; }
    .claim-status { background: #fef3c7; color: #92400e; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .claim-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; font-size: 13px; }
    .claim-detail-label { color: #9ca3af; font-size: 11px; }
    .claim-detail-value { font-weight: 600; margin-top: 2px; }
  </style>
</head>
<body>
<div class="shell">
  <div class="header">
    <a href="#">← Agent Home</a>
    <span class="badge">Claim System</span>
    <h1 class="title">Submit & Track Claims</h1>
    <p class="claimant">Submitting as: Demo Agent</p>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="submit">Submit New</button>
    <button class="tab" data-tab="my-claims">My Claims</button>
  </div>

  <div id="submit-tab" class="tab-content active">
    <div class="upload-card" id="upload-area">
      <label class="upload-area" for="file-input">+ Add receipt photo(s) or PDF — up to 6 read at once</label>
      <input id="file-input" type="file" accept="image/*,application/pdf" class="hidden" />
      <p class="status hidden" id="upload-status"></p>
    </div>

    <div id="cards"></div>
  </div>

  <div id="my-claims-tab" class="tab-content">
    <div id="my-claims-list"></div>
  </div>
</div>

<script>
let claimData = null;
let uploadedImageSrc = null;

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    const tabName = tab.dataset.tab;
    document.getElementById(tabName + '-tab').classList.add('active');

    if (tabName === 'my-claims' && claimData) {
      showMyClaims();
    }
  });
});

document.getElementById('upload-area').addEventListener('click', () => {
  document.getElementById('file-input').click();
});

document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // Read the image for display
  const reader = new FileReader();
  reader.onload = (event) => {
    uploadedImageSrc = event.target.result;

    // Show processing status
    const cards = document.getElementById('cards');
    cards.innerHTML = '<p class="status">Processing receipt with AI OCR...</p>';

    // Simulate OCR processing delay
    setTimeout(() => {
      showClaimForm();
    }, 2500);
  };
  reader.readAsDataURL(file);
});

function showClaimForm() {
  const cardId = 'receipt-1';

  const html = `
    <div class="card">
      <div class="card-head">
        <img class="thumb" src="${uploadedImageSrc}" alt="Receipt">
        <div>
          <div class="file-name">sample-claim.png</div>
        </div>
      </div>
      <p class="status">✓ AI extracted claim details</p>
      <form class="form-grid" id="claim-form">
        <div class="row">
          <div class="field">
            <label class="field-label">Vendor</label>
            <input type="text" id="vendor-${cardId}" value="Tech Supply Store">
          </div>
          <div class="field">
            <label class="field-label">Category</label>
            <select id="category-${cardId}">
              <option value="">Select</option>
              <option value="Office Supplies" selected>Office Supplies</option>
              <option value="Transport / Fuel">Transport / Fuel</option>
              <option value="Meals">Meals</option>
              <option value="Others">Others</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Item purchased</label>
          <input type="text" id="item-${cardId}" value="Computer accessories">
        </div>

        <div class="field">
          <label class="field-label">Purpose / description</label>
          <textarea id="description-${cardId}">Office equipment for project installation</textarea>
        </div>

        <div class="row">
          <div class="field">
            <label class="field-label">Date</label>
            <input type="date" id="date-${cardId}" value="2026-07-30">
          </div>
          <div class="field">
            <label class="field-label">Receipt no.</label>
            <input type="text" id="receiptid-${cardId}" value="INV-2024-5678">
          </div>
        </div>

        <div class="row">
          <div class="field" style="flex: 2;">
            <label class="field-label">Amount</label>
            <input type="text" id="amount-${cardId}" value="285.50">
          </div>
          <div class="field">
            <label class="field-label">Currency</label>
            <input type="text" id="currency-${cardId}" value="MYR">
          </div>
        </div>

        <div class="row">
          <button type="submit" class="btn">Update</button>
          <button type="button" class="btn-delete">Delete</button>
        </div>
      </form>
    </div>
  `;

  document.getElementById('cards').innerHTML = html;

  document.getElementById('claim-form').addEventListener('submit', (e) => {
    e.preventDefault();

    claimData = {
      vendor: document.getElementById(`vendor-${cardId}`).value,
      category: document.getElementById(`category-${cardId}`).value,
      item: document.getElementById(`item-${cardId}`).value,
      description: document.getElementById(`description-${cardId}`).value,
      date: document.getElementById(`date-${cardId}`).value,
      receiptId: document.getElementById(`receiptid-${cardId}`).value,
      amount: document.getElementById(`amount-${cardId}`).value,
      currency: document.getElementById(`currency-${cardId}`).value,
      imageSrc: uploadedImageSrc,
      status: 'Pending'
    };

    document.getElementById('cards').innerHTML = '<p class="status">✓ Claim submitted successfully</p>';

    setTimeout(() => {
      document.getElementById('cards').innerHTML = '';
    }, 2000);
  });
}

function showMyClaims() {
  if (!claimData) {
    document.getElementById('my-claims-list').innerHTML = '<p style="text-align: center; color: #9ca3af; padding: 40px;">No claims submitted yet</p>';
    return;
  }

  const html = `
    <div class="claim-item">
      <div class="claim-header">
        <div>
          <div class="claim-vendor">${claimData.vendor}</div>
          <div class="claim-desc">${claimData.description}</div>
        </div>
        <span class="claim-status">${claimData.status}</span>
      </div>
      <div class="claim-details">
        <div>
          <div class="claim-detail-label">Amount</div>
          <div class="claim-detail-value">${claimData.currency} ${claimData.amount}</div>
        </div>
        <div>
          <div class="claim-detail-label">Date</div>
          <div class="claim-detail-value">${claimData.date}</div>
        </div>
        <div>
          <div class="claim-detail-label">Category</div>
          <div class="claim-detail-value">${claimData.category}</div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('my-claims-list').innerHTML = html;
}
</script>
</body>
</html>
